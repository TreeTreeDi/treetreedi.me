name: fill-impeccable
on:
  push:
    branches:
      - cursor/impeccable-skills-4f98

jobs:
  fill:
    if: github.event.head_commit.message == 'trigger impeccable fill'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/impeccable-skills-4f98
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Official Impeccable install
        run: npx -y impeccable@4.1.0 install -y --providers=cursor --scope=project --force
      - name: Commit skill and hook files
        run: |
          rm -rf .cursor/skills/impeccable/scripts/bin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .cursor/hooks.json .cursor/agents .cursor/skills/impeccable
          if git diff --cached --quiet; then
            echo "No skill/hook changes"
            exit 0
          fi
          git commit -m "Add remaining Impeccable skill files from official installer."
          git push
